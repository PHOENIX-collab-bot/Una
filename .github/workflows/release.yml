name: Release & Publish Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run verification tests
        run: |
          python -m py_compile bot.py memory_rag.py
          python -m unittest discover -s tests -v
          bash -n install.sh

      - name: Build Python wheel & source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Build lightweight Linux deploy bundle
        run: |
          mkdir -p bundle/una
          cp bot.py memory_rag.py requirements.txt .env.example install.sh docker-compose.yml Dockerfile LICENSE README.md bundle/una/
          tar -czf dist/una-linux-deploy.tar.gz -C bundle una

      - name: Resolve release tag and notes
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          NOTES_FILE="docs/RELEASE_NOTES_${TAG}.md"
          if [ -f "${NOTES_FILE}" ]; then
            echo "notes_file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"
          else
            echo "notes_file=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Una ${{ steps.meta.outputs.tag }}"
          body_path: ${{ steps.meta.outputs.notes_file }}
          generate_release_notes: ${{ steps.meta.outputs.notes_file == '' }}
          files: |
            dist/*.whl
            dist/*.tar.gz

  publish-docker-package:
    runs-on: ubuntu-latest
    needs: build-and-release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase repository name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.name }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push Docker image to GitHub Packages
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
